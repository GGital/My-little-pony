<style>

<body>
<div class="frame">
<p class="eyebrow">State machine · TCG Event Hub · BR-05–BR-12, BR-18–BR-20</p>
<h1>Life of a registration</h1>
<div class="diagram-container">
<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="state-registration-title state-registration-desc"><title id="state-registration-title">Registration state machine</title><desc id="state-registration-desc">A registration starts as Registered and can become Checked in (with undo), Cancelled by the player, Event cancelled by the organizer, or reported as a No-show when the event ends without check-in.</desc><defs>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs><rect width="100%" height="100%" fill="#f5f5f5"/><line x1="62" y1="208" x2="120" y2="208" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/><rect x="67" y="190" width="48" height="12" rx="2" fill="#f5f5f5"/><text x="91" y="199" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REGISTER</text><line x1="280" y1="196" x2="480" y2="196" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="356" y="178" width="48" height="12" rx="2" fill="#f5f5f5"/><text x="380" y="187" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CHECK IN</text><line x1="480" y1="220" x2="280" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="366" y="226" width="28" height="12" rx="2" fill="#f5f5f5"/><text x="380" y="235" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">UNDO</text><path d="M248 240 V272 Q248 280 256 280 H392 Q400 280 400 288 V328 Q400 336 408 336 H480" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="408" y="300" width="60" height="12" rx="2" fill="#f5f5f5"/><text x="412" y="309" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.06em">EVENT ENDS</text><line x1="200" y1="240" x2="200" y2="336" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="130" y="282" width="40" height="12" rx="2" fill="#f5f5f5"/><text x="150" y="291" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CANCEL</text><line x1="200" y1="176" x2="200" y2="112" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="116" y="138" width="68" height="12" rx="2" fill="#f5f5f5"/><text x="150" y="147" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CANCEL EVENT</text><line x1="640" y1="208" x2="736" y2="208" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="658" y="190" width="60" height="12" rx="2" fill="#f5f5f5"/><text x="688" y="199" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EVENT ENDS</text><circle cx="56" cy="208" r="6" fill="#2d3142"/><circle cx="748" cy="208" r="10" fill="none" stroke="#2d3142"/><circle cx="748" cy="208" r="6" fill="#2d3142"/><text x="764" y="211" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace">attended</text><rect x="120" y="176" width="160" height="64" rx="8" fill="#f5f5f5"/><rect x="120" y="176" width="160" height="64" rx="8" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/><text x="200" y="208" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Registered</text><text x="200" y="223" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">holds a seat · S1</text><rect x="480" y="176" width="160" height="64" rx="8" fill="#f5f5f5"/><rect x="480" y="176" width="160" height="64" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="560" y="208" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Checked in</text><text x="560" y="223" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">holds a seat · S3</text><rect x="480" y="304" width="160" height="64" rx="8" fill="#f5f5f5"/><rect x="480" y="304" width="160" height="64" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/><circle cx="624" cy="320" r="7" fill="none" stroke="#4f5d75"/><circle cx="624" cy="320" r="4" fill="#4f5d75"/><text x="560" y="336" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">No-show</text><text x="560" y="351" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">reported after end · S3</text><rect x="120" y="336" width="160" height="64" rx="8" fill="#f5f5f5"/><rect x="120" y="336" width="160" height="64" rx="8" fill="rgba(45,49,66,0.04)" stroke="#4f5d75" stroke-width="1"/><circle cx="264" cy="352" r="7" fill="none" stroke="#4f5d75"/><circle cx="264" cy="352" r="4" fill="#4f5d75"/><text x="200" y="368" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cancelled</text><text x="200" y="383" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">by player · S2</text><rect x="120" y="48" width="160" height="64" rx="8" fill="#f5f5f5"/><rect x="120" y="48" width="160" height="64" rx="8" fill="rgba(45,49,66,0.04)" stroke="#4f5d75" stroke-width="1"/><circle cx="264" cy="64" r="7" fill="none" stroke="#4f5d75"/><circle cx="264" cy="64" r="4" fill="#4f5d75"/><text x="200" y="80" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Event cancelled</text><text x="200" y="95" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">by organizer · S2</text><text x="480" y="416" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">Register needs a free seat and no other</text><text x="480" y="434" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">active registration. Check-in and undo only</text><text x="480" y="452" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">inside the window (BR-05, BR-06, BR-18).</text><line x1="32" y1="472" x2="828" y2="472" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="32" y="488" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text><rect x="112" y="480" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520"/><text x="132" y="488" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Sprint 1 state</text><rect x="239" y="480" width="14" height="10" rx="2" fill="#fff" stroke="#2d3142"/><text x="259" y="488" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Active state</text><rect x="356" y="480" width="14" height="10" rx="2" fill="rgba(45,49,66,0.04)" stroke="#4f5d75"/><text x="376" y="488" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Terminal</text><rect x="452" y="480" width="14" height="10" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-dasharray="4,3"/><text x="472" y="488" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Derived in reports</text></svg>
</div>
</div>
</body>
</html>
